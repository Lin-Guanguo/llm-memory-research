site_name: LLM Agent Research
site_description: Memory, context management, and continuous learning in LLM agents
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: README.md
  - Blog:
    - "2: Agent Context & Memory (EN)": blog.2.md
    - "2: Agent 上下文与记忆 (CN)": blog.2.chinese.md
